# Shared config. Per-profile overrides live in application-{profile}.yaml.
# There is intentionally no application-test.yaml so tests keep using Dev Services.
quarkus:
  datasource:
    db-kind: postgresql
    devservices:
      # Keep in sync with the postgres image in local-env/docker-compose*.yml.
      image-name: postgres:18.1
  flyway:
    migrate-at-start: true
