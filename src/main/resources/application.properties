quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

# The REST/CDI classes defined in :adapters (a plain Java module, no Quarkus plugin applied)
# need to be explicitly indexed for Quarkus to discover @Path/@Provider/CDI beans there.
quarkus.index-dependency.adapters.group-id=com.dgop92.ledger_v1
quarkus.index-dependency.adapters.artifact-id=adapters

# Dev: dedicated local Postgres from local-env/docker-compose.yml (no Dev Services).
# Defaults match the compose file; override with DB_URL / DB_USERNAME / DB_PASSWORD.
# The %test profile is intentionally left unset so tests keep using Dev Services.
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ledger}
%dev.quarkus.datasource.username=${DB_USERNAME:ledger}
%dev.quarkus.datasource.password=${DB_PASSWORD:ledger}

%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
